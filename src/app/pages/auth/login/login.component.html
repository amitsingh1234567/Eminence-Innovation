
<div class="login-container">
<mat-card class="login-card">
    <!-- <mat-spinner *ngIf='isLoading'></mat-spinner> -->
    <form (submit)="onLogin(loginForm)" #loginForm="ngForm"  >
      <mat-form-field class="full-width">
        <input
          matInput
          type="email"
          name="email"
          ngModel
          placeholder="E-Mail"  
          #emailInput="ngModel"
          required email

          >
        <mat-error *ngIf="emailInput.invalid">Please enter a valid email.</mat-error>
      </mat-form-field>
  
      <mat-form-field class="full-width">
        <input type="password" name="password" matInput placeholder="Password" ngModel  #passwordInput="ngModel" required>
        <mat-error *ngIf="passwordInput.invalid">Please enter a valid password.</mat-error>
      </mat-form-field>
    <button
        mat-raised-button
        color="accent"
        type="submit">Login</button>

    </form>
    <p> Don't have an acount? <a routerLink='/signup'>Sign up</a> </p>
</mat-card>
</div>
