<div class="task-container">
    <h2>Task Management</h2>
    <button mat-raised-button color="primary" (click)="openTaskDialog()">Create Task</button>
    <button mat-raised-button color="accent" class="l-btn" (click)="logout()">Logout</button>
    
    <div class="table-container" *ngIf="showTable">
      <p>You are working as a <b>{{roleName}}</b></p>
        <table mat-table [dataSource]="tasks" class="mat-elevation-z8" matSort>

        <!-- Task Title Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Task Title</th>
          <td mat-cell *matCellDef="let task">{{ task.title }}</td>
        </ng-container>
    
        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let task">{{ task.description }}</td>
        </ng-container>
    
        <!-- Assigned To Column -->
        <ng-container matColumnDef="assignTo">
          <th mat-header-cell *matHeaderCellDef>Assigned To</th>
          <td mat-cell *matCellDef="let task">{{ task.assignTo?.name }}</td>
        </ng-container>
    
        <!-- Role Column -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let task">{{ task.assignTo?.role }}</td>
        </ng-container>
    
        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let task">
            <span [ngClass]="{'pending': task.status === 'pending', 'approved': task.status === 'approved'}">
              {{ task.status | titlecase }}
            </span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let task">
                <button mat-icon-button color="accent" (click)="editTask(task)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteTask(task._id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    </div>
</div>
